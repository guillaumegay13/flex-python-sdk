[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flex-mcp-server"
version = "0.1.0"
description = "MCP server for Dalet Flex API - read-only operations"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Guillaume Gay", email = "guillaume.gay@protonmail.com" }
]
maintainers = [
    { name = "Guillaume Gay", email = "guillaume.gay@protonmail.com" }
]
keywords = ["dalet", "flex", "mcp", "ai", "claude", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Video",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
requires-python = ">=3.8"
dependencies = [
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/your-username/flex-python-sdk"
Documentation = "https://github.com/your-username/flex-python-sdk/tree/main/mcp-server"
Repository = "https://github.com/your-username/flex-python-sdk.git"
Issues = "https://github.com/your-username/flex-python-sdk/issues"

[project.scripts]
flex-mcp = "flex_mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["."]